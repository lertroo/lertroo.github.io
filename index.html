<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイト一覧</title>
<meta name="description" content="GitHub Pagesで公開しているサイトの一覧">
<link rel="stylesheet" href="style.css">
<script>
  // 描画前にテーマと文字サイズを当てて、ちらつきを防ぐ
  (() => {
    const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
    const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = get('top-theme') || (dark ? 'dark' : 'light');
    document.documentElement.dataset.font = get('top-font') || 'm';
  })();
</script>
</head>
<body>
<header class="bar">
  <h1 class="title">サイト一覧</h1>
  <div class="seg" id="font-seg" aria-label="文字サイズ">
    <button type="button" data-font="s">小</button>
    <button type="button" data-font="m">中</button>
    <button type="button" data-font="l">大</button>
  </div>
  <div class="seg" id="theme-seg" aria-label="表示">
    <button type="button" data-theme="light">ライト</button>
    <button type="button" data-theme="dark">ダーク</button>
  </div>
</header>

<main>
  <!-- サイトが増えたら <li> を追記する -->
  <ul class="sites">
    <li>
      <a href="https://lertroo.github.io/discover-articles/">Discover Articles</a>
      <span class="url">https://lertroo.github.io/discover-articles/</span>
      <p class="desc">地図上で、近くのウィキペディア記事を探すウェブページ</p>
    </li>
    <li>
      <a href="https://lertroo.github.io/tsutsu-urara/">tsutsu-urara</a>
      <span class="url">https://lertroo.github.io/tsutsu-urara/</span>
      <p class="desc">日本地図の上で、行ったところを記録するウェブページ</p>
    </li>
  </ul>
</main>

<script src="app.js"></script>
</body>
</html>
